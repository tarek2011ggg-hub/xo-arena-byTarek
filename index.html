<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO ARENA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
background:
radial-gradient(circle at top,#24305e 0%,transparent 35%),
linear-gradient(135deg,#070812,#11152b 50%,#070812);
display:flex;
justify-content:center;
align-items:center;
padding:15px
}

.game{
width:min(94%,520px);
padding:25px;
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
background:rgba(15,18,38,.85);
box-shadow:0 25px 80px rgba(0,0,0,.55);
backdrop-filter:blur(18px)
}

.start-screen{text-align:center}

.logo{
font-size:36px;
font-weight:900;
letter-spacing:3px;
margin-bottom:8px
}

.subtitle{
color:#9298b8;
margin-bottom:25px
}

.input-box{margin-bottom:15px}

.input-box label{
display:block;
margin-bottom:7px;
font-weight:bold
}

input{
width:100%;
padding:15px;
border:1px solid rgba(255,255,255,.12);
border-radius:15px;
background:rgba(255,255,255,.06);
color:white;
outline:none;
font-size:16px;
text-align:center
}

input:focus{
border-color:#7c5cff;
box-shadow:0 0 15px rgba(124,92,255,.2)
}

.start-button{
width:100%;
margin-top:10px;
border:0;
padding:15px;
border-radius:15px;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(135deg,#7658ff,#9b5cff)
}

#gameScreen{display:none}

.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.player{
padding:15px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
text-align:center;
transition:.25s
}

.player.active{
border-color:#7c5cff;
box-shadow:0 0 25px rgba(124,92,255,.25);
transform:translateY(-3px)
}

.avatar{font-size:38px}

.name{
font-weight:bold;
margin-top:5px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.score{
font-size:27px;
font-weight:900;
margin-top:5px
}

.status{
text-align:center;
margin:22px 0;
font-size:18px;
font-weight:bold
}

.board{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
max-width:390px;
margin:auto
}

.cell{
aspect-ratio:1;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
background:rgba(255,255,255,.055);
color:white;
font-size:clamp(35px,10vw,65px);
font-weight:900;
cursor:pointer;
transition:.18s
}

.cell:hover:not(:disabled){
transform:scale(1.04);
background:rgba(124,92,255,.15);
border-color:#7c5cff
}

.cell:disabled{cursor:default}

.cell.m{
color:#ff3b3b;
text-shadow:0 0 20px rgba(255,59,59,.7)
}

.cell.t{
color:#35e06f;
text-shadow:0 0 20px rgba(53,224,111,.7)
}

border-color:#

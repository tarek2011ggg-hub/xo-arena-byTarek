<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO ARENA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
background:
radial-gradient(circle at top,#24305e 0%,transparent 35%),
linear-gradient(135deg,#070812,#11152b 50%,#070812);
display:flex;
justify-content:center;
align-items:center;
padding:15px
}

.game{
width:min(94%,520px);
padding:25px;
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
background:rgba(15,18,38,.85);
box-shadow:0 25px 80px rgba(0,0,0,.55);
backdrop-filter:blur(18px)
}

.start-screen{text-align:center}

.logo{
font-size:36px;
font-weight:900;
letter-spacing:3px;
margin-bottom:8px
}

.subtitle{
color:#9298b8;
margin-bottom:25px
}

.input-box{margin-bottom:15px}

.input-box label{
display:block;
margin-bottom:7px;
font-weight:bold
}

input{
width:100%;
padding:15px;
border:1px solid rgba(255,255,255,.12);
border-radius:15px;
background:rgba(255,255,255,.06);
color:white;
outline:none;
font-size:16px;
text-align:center
}

input:focus{
border-color:#7c5cff;
box-shadow:0 0 15px rgba(124,92,255,.2)
}

.start-button{
width:100%;
margin-top:10px;
border:0;
padding:15px;
border-radius:15px;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(135deg,#7658ff,#9b5cff)
}

#gameScreen{display:none}

.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.player{
padding:15px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
text-align:center;
transition:.25s
}

.player.active{
border-color:#7c5cff;
box-shadow:0 0 25px rgba(124,92,255,.25);
transform:translateY(-3px)
}

.avatar{font-size:38px}

.name{
font-weight:bold;
margin-top:5px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.score{
font-size:27px;
font-weight:900;
margin-top:5px
}

.status{
text-align:center;
margin:22px 0;
font-size:18px;
font-weight:bold
}

.board{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
max-width:390px;
margin:auto
}

.cell{
aspect-ratio:1;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
background:rgba(255,255,255,.055);
color:white;
font-size:clamp(35px,10vw,65px);
font-weight:900;
cursor:pointer;
transition:.18s
}

.cell:hover:not(:disabled){
transform:scale(1.04);
background:rgba(124,92,255,.15);
border-color:#7c5cff
}

.cell:disabled{cursor:default}

.cell.m{text-shadow:0 0 20px #55aaff}
.cell.t{text-shadow:0 0 20px #ff5ca8}

.cell.winner{
animation:win .7s infinite alternate;
border-color:#ffd84d;
background:rgba(255,216,77,.12)
}

@keyframes win{
from{transform:scale(1)}
to{transform:scale(1.07)}
}

.buttons{
display:flex;
gap:10px;
margin-top:22px
}

.control{
flex:1;
border:0;
padding:14px;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
background:linear-gradient(135deg,#7658ff,#9b5cff)
}

.reset-score{
background:rgba(255,255,255,.08)
}

.developer{
text-align:center;
color:#777d9d;
font-size:13px;
margin-top:20px
}

@media(max-width:400px){
.game{padding:18px}
.logo{font-size:28px}
.board{gap:8px}
.cell{border-radius:15px}
}
</style>
</head>

<body>

<div class="game">

<div class="start-screen" id="startScreen">

<div class="logo">⚡ XO ARENA</div>

<div class="subtitle">لعبة XO للاعبين</div>

<div class="input-box">
<label>👤 اسم اللاعب الأول</label>
<input id="nameM" type="text" maxlength="15" placeholder="اكتب اسمك">
</div>

<div class="input-box">
<label>👤 اسم اللاعب الثاني</label>
<input id="nameT" type="text" maxlength="15" placeholder="اكتب اسمك">
</div>

<button class="start-button" id="startButton">
🎮 ابدأ اللعب
</button>

<div class="developer">المطور: طارق محمود</div>

</div>


<div id="gameScreen">

<div class="logo" style="text-align:center;">
⚡ XO ARENA
</div>

<div class="subtitle" style="text-align:center;">
مواجهة XO
</div>

<div class="players">

<div class="player active" id="playerM">
<div class="avatar">🇲</div>
<div class="name" id="displayNameM">اللاعب الأول</div>
<div class="score" id="scoreM">0</div>
</div>

<div class="player" id="playerT">
<div class="avatar">🇹</div>
<div class="name" id="displayNameT">اللاعب الثاني</div>
<div class="score" id="scoreT">0</div>
</div>

</div>

<div class="status" id="status"></div>

<div class="board" id="board"></div>

<div class="buttons">

<button class="control" id="newGameButton">
🎮 جولة جديدة
</button>

<button class="control reset-score" id="resetButton">
🗑️ تصفير النقاط
</button>

</div>

<div class="developer">
المطور: طارق محمود
</div>

</div>

</div>


<script>

const board = document.getElementById("board");
const status = document.getElementById("status");

const playerM = document.getElementById("playerM");
const playerT = document.getElementById("playerT");

const scoreM = document.getElementById("scoreM");
const scoreT = document.getElementById("scoreT");

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");

const displayNameM = document.getElementById("displayNameM");
const displayNameT = document.getElementById("displayNameT");

const nameInputM = document.getElementById("nameM");
const nameInputT = document.getElementById("nameT");

const startButton = document.getElementById("startButton");
const newGameButton = document.getElementById("newGameButton");
const resetButton = document.getElementById("resetButton");


let nameM = "";
let nameT = "";

let cells = Array(9).fill("");

let turn = "M";

let gameOver = false;

let scores = {
M: 0,
T: 0
};


const wins = [
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];


function startGame(){

nameM = nameInputM.value.trim();
nameT = nameInputT.value.trim();

if(!nameM){
nameM = "اللاعب الأول";
}

if(!nameT){
nameT = "اللاعب الثاني";
}

displayNameM.textContent = nameM;
displayNameT.textContent = nameT;

startScreen.style.display = "none";
gameScreen.style.display = "block";

startNewGame();
}


function drawBoard(){

board.innerHTML = "";

cells.forEach((value,index)=>{

const cell = document.createElement("button");

cell.className = "cell";

if(value === "M"){
cell.textContent = "🇲";
cell.classList.add("m");
}

if(value === "T"){
cell.textContent = "🇹";
cell.classList.add("t");
}

cell.disabled = value !== "" || gameOver;

cell.addEventListener("click",()=>{
play(index);
});

board.appendChild(cell);

});

}


function updatePlayers(){

playerM.classList.toggle(
"active",
turn === "M" && !gameOver
);

playerT.classList.toggle(
"active",
turn === "T" && !gameOver
);

}


function updateStatus(){

if(turn === "M"){
status.textContent = `دور ${nameM} 🇲`;
}else{
status.textContent = `دور ${nameT} 🇹`;
}

}


function play(index){

if(cells[index] !== "" || gameOver){
return;
}

cells[index] = turn;


const winningLine = wins.find(line =>
line.every(i => cells[i] === turn)
);


if(winningLine){

gameOver = true;

scores[turn]++;

scoreM.textContent = scores.M;
scoreT.textContent = scores.T;

const winner =
turn === "M"
? nameM + " 🇲"
: nameT + " 🇹";

status.textContent =
`🏆 ${winner} كسب الجولة!`;

drawBoard();

winningLine.forEach(i=>{
board.children[i].classList.add("winner");
});

updatePlayers();

return;
}


if(cells.every(cell => cell !== "")){

gameOver = true;

status.textContent = "🤝 تعادل!";

drawBoard();

updatePlayers();

return;
}


turn = turn === "M" ? "T" : "M";

updateStatus();

drawBoard();

updatePlayers();

}


function startNewGame(){

cells = Array(9).fill("");

turn = "M";

gameOver = false;

updateStatus();

drawBoard();

updatePlayers();

}


function resetScore(){

scores.M = 0;
scores.T = 0;

scoreM.textContent = "0";
scoreT.textContent = "0";

startNewGame();

}


startButton.addEventListener("click", startGame);

newGameButton.addEventListener("click", startNewGame);

resetButton.addEventListener("click", resetScore);


</script>

</body>
  </html>

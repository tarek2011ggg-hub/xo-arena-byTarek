<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XO ARENA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;

    background:
        radial-gradient(circle at top,#24305e 0%,transparent 35%),
        linear-gradient(135deg,#070812,#11152b 50%,#070812);

    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.game{
    width:min(94%,520px);
    padding:25px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;

    background:rgba(15,18,38,.88);

    box-shadow:0 25px 80px rgba(0,0,0,.55);

    backdrop-filter:blur(18px);
}

.logo{
    font-size:36px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
    text-align:center;
}

.subtitle{
    color:#9298b8;
    margin-bottom:25px;
    text-align:center;
}

.screen{
    text-align:center;
}

.mode-buttons,
.level-buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.mode-button,
.level-button{
    width:100%;
    padding:17px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;

    color:white;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    background:rgba(255,255,255,.06);

    transition:.2s;
}

.mode-button:hover,
.level-button:hover{
    transform:translateY(-2px);
    border-color:#7c5cff;
    background:rgba(124,92,255,.15);
    box-shadow:0 8px 25px rgba(124,92,255,.2);
}

.back-button{
    margin-top:15px;
    width:100%;
    padding:13px;

    border:0;
    border-radius:14px;

    color:#bbbfd4;
    background:rgba(255,255,255,.06);

    cursor:pointer;
}

.input-box{
    margin-bottom:15px;
}

.input-box label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:15px;

    background:rgba(255,255,255,.06);
    color:white;

    outline:none;

    font-size:16px;
    text-align:center;
}

input:focus{
    border-color:#7c5cff;
    box-shadow:0 0 15px rgba(124,92,255,.2);
}

.start-button{
    width:100%;
    margin-top:10px;
    border:0;
    padding:15px;

    border-radius:15px;

    color:white;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(135deg,#7658ff,#9b5cff);

    transition:.2s;
}

.start-button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(124,92,255,.25);
}

#gameScreen,
#nameScreen,
#levelScreen,
#startScreen{
    display:none;
}

#homeScreen{
    display:block;
}

.players{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.player{
    padding:15px;

    border-radius:18px;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    text-align:center;

    transition:.25s;
}

.player.active{
    border-color:#7c5cff;
    box-shadow:0 0 25px rgba(124,92,255,.25);
    transform:translateY(-3px);
}

.avatar{
    font-size:38px;
    font-weight:900;
}

.name{
    font-weight:bold;
    margin-top:5px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.score{
    font-size:27px;
    font-weight:900;
    margin-top:5px;
}

.status{
    text-align:center;
    margin:22px 0;

    font-size:18px;
    font-weight:bold;

    min-height:22px;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:12px;

    max-width:390px;
    margin:auto;
}

.cell{
    aspect-ratio:1;

    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;

    background:rgba(255,255,255,.055);

    color:white;

    font-size:clamp(35px,10vw,65px);
    font-weight:900;

    cursor:pointer;

    transition:.18s;

    opacity:1 !important;
}

.cell:hover:not(:disabled){
    transform:scale(1.04);
    background:rgba(124,92,255,.15);
    border-color:#7c5cff;
}

.cell:disabled{
    cursor:default;
}

.cell.m{
    color:#ff3b3b !important;

    text-shadow:
        0 0 10px #ff3b3b,
        0 0 25px #ff3b3b,
        0 0 45px rgba(255,59,59,.8);
}

.cell.t{
    color:#35e06f !important;

    text-shadow:
        0 0 10px #35e06f,
        0 0 25px #35e06f,
        0 0 45px rgba(53,224,111,.8);
}

.cell.winner{
    animation:win .7s infinite alternate;

    border-color:#ffd84d;

    background:rgba(255,216,77,.12);
}

@keyframes win{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.07);
    }
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.control{
    flex:1;

    border:0;
    padding:14px;

    border-radius:15px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    color:white;

    background:linear-gradient(135deg,#7658ff,#9b5cff);
}

.reset-score{
    background:rgba(255,255,255,.08);
}

.developer{
    text-align:center;
    color:#777d9d;
    font-size:13px;
    margin-top:20px;
}

.level-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:18px;
}

.level-button small{
    display:block;
    color:#9298b8;
    margin-top:5px;
    font-weight:normal;
}

@media(max-width:400px){

    .game{
        padding:18px;
    }

    .logo{
        font-size:28px;
    }

    .board{
        gap:8px;
    }

    .cell{
        border-radius:15px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="game">

<!-- الرئيسية -->
<div id="homeScreen" class="screen">

    <div class="logo">
        ⚡ XO ARENA
    </div>

    <div class="subtitle">
        اختر طريقة اللعب
    </div>

    <div class="mode-buttons">

        <button class="mode-button" id="friendMode">
            👥 ضد صاحبك
        </button>

        <button class="mode-button" id="computerMode">
            🖥️ ضد الكمبيوتر
        </button>

    </div>

    <div class="developer">
        المطور: طارق محمود
    </div>

</div>


<!-- اختيار المستوى -->
<div id="levelScreen" class="screen">

    <div class="logo">
        🖥️ الكمبيوتر
    </div>

    <div class="level-title">
        اختار مستوى الكمبيوتر
    </div>

    <div class="level-buttons">

        <button class="level-button" data-level="beginner">
            🟢 مبتدئ
            <small>حركات عشوائية وبسيطة</small>
        </button>

        <button class="level-button" data-level="easy">
            🟡 سهل
            <small>الكمبيوتر يحاول اللعب بشكل أفضل</small>
        </button>

        <button class="level-button" data-level="medium">
            🟠 متوسط
            <small>هجوم ودفاع</small>
        </button>

        <button class="level-button" data-level="hard">
            🔴 صعب
            <small>ذكاء قوي</small>
        </button>

        <button class="level-button" data-level="pro">
            ☠️ لا عيب
            <small>أقوى مستوى — أفضل حركة ممكنة</small>
        </button>

    </div>

    <button class="back-button" id="levelBack">
        ← رجوع
    </button>

</div>


<!-- أسماء اللاعبين -->
<div id="nameScreen" class="screen">

    <div class="logo">
        👥 XO ARENA
    </div>

    <div class="subtitle">
        اكتب أسماء اللاعبين
    </div>

    <div class="input-box">

        <label>
            👤 اسم اللاعب الأول
        </label>

        <input
            id="nameM"
            type="text"
            maxlength="15"
            placeholder="اكتب اسمك"
            autocomplete="off">

    </div>

    <div class="input-box">

        <label>
            👤 اسم اللاعب الثاني
        </label>

        <input
            id="nameT"
            type="text"
            maxlength="15"
            placeholder="اكتب اسمك"
            autocomplete="off">

    </div>

    <button class="start-button" id="startFriend">
        🎮 ابدأ اللعب
    </button>

    <button class="back-button" id="friendBack">
        ← رجوع
    </button>

</div>


<!-- اللعبة -->
<div id="gameScreen">

    <div class="logo">
        ⚡ XO ARENA
    </div>

    <div class="subtitle">
        مواجهة XO
    </div>

    <div class="players">

        <div class="player active" id="playerM">

            <div class="avatar">
                X
            </div>

            <div class="name" id="displayNameM">
                اللاعب الأول
            </div>

            <div class="score" id="scoreM">
                0
            </div>

        </div>


        <div class="player" id="playerT">

            <div class="avatar">
                O
            </div>

            <div class="name" id="displayNameT">
                اللاعب الثاني
            </div>

            <div class="score" id="scoreT">
                0
            </div>

        </div>

    </div>

    <div class="status" id="status">
        دور اللاعب الأول ❌
    </div>

    <div class="board" id="board"></div>

    <div class="buttons">

        <button class="control" id="newGameButton">
            🎮 جولة جديدة
        </button>

        <button class="control reset-score" id="resetButton">
            🗑️ تصفير النقاط
        </button>

    </div>

    <button class="back-button" id="gameBack">
        🏠 القائمة الرئيسية
    </button>

    <div class="developer">
        المطور: طارق محمود
    </div>

</div>

</div>


<script>

const homeScreen =
    document.getElementById("homeScreen");

const levelScreen =
    document.getElementById("levelScreen");

const nameScreen =
    document.getElementById("nameScreen");

const gameScreen =
    document.getElementById("gameScreen");

const friendMode =
    document.getElementById("friendMode");

const computerMode =
    document.getElementById("computerMode");

const levelBack =
    document.getElementById("levelBack");

const friendBack =
    document.getElementById("friendBack");

const gameBack =
    document.getElementById("gameBack");

const startFriend =
    document.getElementById("startFriend");

const board =
    document.getElementById("board");

const status =
    document.getElementById("status");

const nameM =
    document.getElementById("nameM");

const nameT =
    document.getElementById("nameT");

const displayNameM =
    document.getElementById("displayNameM");

const displayNameT =
    document.getElementById("displayNameT");

const scoreM =
    document.getElementById("scoreM");

const scoreT =
    document.getElementById("scoreT");

const playerM =
    document.getElementById("playerM");

const playerT =
    document.getElementById("playerT");

const newGameButton =
    document.getElementById("newGameButton");

const resetButton =
    document.getElementById("resetButton");


let cells = [];

let currentPlayer = "M";

let gameOver = false;

let gameMode = "friend";

let computerLevel = "pro";

let scores = {
    M: 0,
    T: 0
};


const winningPatterns = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


/* إظهار شاشة */

function showScreen(screen){

    homeScreen.style.display = "none";
    levelScreen.style.display = "none";
    nameScreen.style.display = "none";
    gameScreen.style.display = "none";

    screen.style.display = "block";
}


/* ضد صاحبك */

friendMode.onclick = function(){

    showScreen(nameScreen);

};


/* ضد الكمبيوتر */

computerMode.onclick = function(){

    showScreen(levelScreen);

};


/* رجوع المستوى */

levelBack.onclick = function(){

    showScreen(homeScreen);

};


/* رجوع الأسماء */

friendBack.onclick = function(){

    showScreen(homeScreen);

};


/* اختيار المستوى */

document.querySelectorAll(".level-button").forEach(function(button){

    button.onclick = function(){

        computerLevel =
            button.dataset.level;

        gameMode = "computer";

        startComputerGame();

    };

});


/* بدء ضد صاحبك */

startFriend.onclick = function(){

    gameMode = "friend";

    let p1 =
        nameM.value.trim();

    let p2 =
        nameT.value.trim();


    if(p1 === ""){
        p1 = "اللاعب الأول";
    }

    if(p2 === ""){
        p2 = "اللاعب الثاني";
    }


    displayNameM.textContent = p1;
    displayNameT.textContent = p2;


    scores.M = 0;
    scores.T = 0;

    updateScores();

    showScreen(gameScreen);

    startNewRound();

};


/* بدء الكمبيوتر */

function startComputerGame(){

    displayNameM.textContent = "أنت";
    displayNameT.textContent = "الكمبيوتر 🖥️";

    scores.M = 0;
    scores.T = 0;

    updateScores();

    showScreen(gameScreen);

    startNewRound();

}


/* إنشاء اللوحة */

function createBoard(){

    board.innerHTML = "";

    cells = [];

    for(let i = 0; i < 9; i++){

        const cell =
            document.createElement("button");

        cell.type = "button";

        cell.className = "cell";

        cell.onclick = function(){

            makeMove(i);

        };

        board.appendChild(cell);

        cells.push(cell);

    }

}


/* جولة جديدة */

function startNewRound(){

    currentPlayer = "M";

    gameOver = false;

    createBoard();

    updateTurn();

}


/* الحركة */

function makeMove(index){

    if(gameOver){
        return;
    }

    if(
        gameMode === "computer" &&
        currentPlayer === "T"
    ){
        return;
    }


    const cell = cells[index];


    if(
        !cell ||
        cell.textContent !== ""
    ){
        return;
    }


    if(currentPlayer === "M"){

        cell.textContent = "X";

        cell.classList.add("m");

    }else{

        cell.textContent = "O";

        cell.classList.add("t");

    }


    cell.disabled = true;


    const winner =
        checkWinner();


    if(winner){

        finishRound(winner);

        return;

    }


    if(isDraw()){

        gameOver = true;

        playerM.classList.remove("active");
        playerT.classList.remove("active");

        status.textContent =
            "🤝 تعادل!";

        return;

    }


    currentPlayer =
        currentPlayer === "M"
        ? "T"
        : "M";


    updateTurn();


    if(
        gameMode === "computer" &&
        currentPlayer === "T" &&
        !gameOver
    ){

        setTimeout(
            computerMove,
            350
        );

    }

}


/* فحص الفوز */

function checkWinner(){

    for(
        let i = 0;
        i < winningPatterns.length;
        i++
    ){

        const p =
            winningPatterns[i];

        const a =
            cells[p[0]].textContent;

        const b =
            cells[p[1]].textContent;

        const c =
            cells[p[2]].textContent;


        if(
            a !== "" &&
            a === b &&
            b === c
        ){

            return p;

        }

    }

    return null;

}


/* التعادل */

function isDraw(){

    return cells.every(function(cell){

        return cell.textContent !== "";

    });

}


/* نهاية الجولة */

function finishRound(pattern){

    gameOver = true;


    pattern.forEach(function(index){

        cells[index]
            .classList
            .add("winner");

    });


    scores[currentPlayer]++;

    updateScores();


    let winnerName;


    if(currentPlayer === "M"){

        winnerName =
            displayNameM.textContent;

        playerM.classList.add("active");
        playerT.classList.remove("active");

    }else{

        winnerName =
            displayNameT.textContent;

        playerT.classList.add("active");
        playerM.classList.remove("active");

    }


    status.textContent =
        "🏆 " +
        winnerName +
        " فاز بالجولة!";

}


/* تحديث الدور */

function updateTurn(){

    if(currentPlayer === "M"){

        status.textContent =
            "دور " +
            displayNameM.textContent +
            " ❌";

        playerM.classList.add("active");
        playerT.classList.remove("active");

    }else{

        status.textContent =
            "دور " +
            displayNameT.textContent +
            " ⭕";

        playerT.classList.add("active");
        playerM.classList.remove("active");

    }

}


/* تحديث النقاط */

function updateScores(){

    scoreM.textContent = scores.M;

    scoreT.textContent = scores.T;

}


/* حركة الكمبيوتر */

function computerMove(){

    if(
        gameOver ||
        currentPlayer !== "T"
    ){
        return;
    }


    let move;


    if(computerLevel === "beginner"){

        move =
            randomMove();

    }

    else if(computerLevel === "easy"){

        move =
            Math.random() < 0.55
            ? bestSimpleMove()
            : randomMove();

    }

    else if(computerLevel === "medium"){

        move =
            Math.random() < 0.8
            ? bestSimpleMove()
            : randomMove();

    }

    else if(computerLevel === "hard"){

        move =
            Math.random() < 0.95
            ? minimaxRoot()
            : randomMove();

    }

    else{

        /* ☠️ لا عيب */

        move =
            minimaxRoot();

    }


    if(move === null || move === undefined){
        return;
    }


    const cell =
        cells[move];


    cell.textContent = "O";

    cell.classList.add("t");

    cell.disabled = true;


    const winner =
        checkWinner();


    if(winner){

        finishRound(winner);

        return;

    }


    if(isDraw()){

        gameOver = true;

        playerM.classList.remove("active");
        playerT.classList.remove("active");

        status.textContent =
            "🤝 تعادل!";

        return;

    }


    currentPlayer = "M";

    updateTurn();

}


/* حركة عشوائية */

function randomMove(){

    const available = [];


    for(let i = 0; i < cells.length; i++){

        if(cells[i].textContent === ""){

            available.push(i);

        }

    }


    if(available.length === 0){
        return null;
    }


    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];

}


/* حركة بسيطة */

function bestSimpleMove(){

    /* الفوز */

    for(let i = 0; i < 9; i++){

        if(cells[i].textContent !== ""){
            continue;
        }

        cells[i].textContent = "O";

        if(checkWinner()){

            cells[i].textContent = "";

            return i;

        }

        cells[i].textContent = "";

    }


    /* منع اللاعب من الفوز */

    for(let i = 0; i < 9; i++){

        if(cells[i].textContent !== ""){
            continue;
        }

        cells[i].textContent = "X";

        if(checkWinner()){

            cells[i].textContent = "";

            return i;

        }

        cells[i].textContent = "";

    }


    /* الوسط */

    if(cells[4].textContent === ""){
        return 4;
    }


    /* زاوية */

    const corners =
        [0,2,6,8].filter(function(i){

            return cells[i].textContent === "";

        });


    if(corners.length > 0){

        return corners[
            Math.floor(
                Math.random() *
                corners.length
            )
        ];

    }


    return randomMove();

}


/* =========================
   MINIMAX
   مستوى ☠️ لا عيب
========================= */

function minimaxRoot(){

    let bestScore = -Infinity;

    let bestMove = null;


    for(let i = 0; i < 9; i++){

        if(cells[i].textContent !== ""){
            continue;
        }


        cells[i].textContent = "O";


        const score =
            minimax(false,0);


        cells[i].textContent = "";


        if(score > bestScore){

            bestScore = score;

            bestMove = i;

        }

    }


    return bestMove;

}


function minimax(isMaximizing, depth){

    const winner =
        checkWinner();


    if(winner){

        const symbol =
            cells[winner[0]].textContent;


        if(symbol === "O"){
            return 10 - depth;
        }

        if(symbol === "X"){
            return depth - 10;
        }

    }


    if(isDraw()){
        return 0;
    }


    if(isMaximizing){

        let bestScore = -Infinity;


        for(let i = 0; i < 9; i++){

            if(cells[i].textContent !== ""){
                continue;
            }


            cells[i].textContent = "O";


            const score =
                minimax(false,depth + 1);


            cells[i].textContent = "";


            bestScore =
                Math.max(
                    bestScore,
                    score
                );

        }


        return bestScore;

    }


    else{

        let bestScore = Infinity;


        for(let i = 0; i < 9; i++){

            if(cells[i].textContent !== ""){
                continue;
            }


            cells[i].textContent = "X";


            const score =
                minimax(true,depth + 1);


            cells[i].textContent = "";


            bestScore =
                Math.min(
                    bestScore,
                    score
                );

        }


        return bestScore;

    }

}


/* رجوع للقائمة */

gameBack.onclick = function(){

    showScreen(homeScreen);

    gameOver = true;

};


/* جولة جديدة */

newGameButton.onclick = function(){

    startNewRound();

};


/* تصفير النقاط */

resetButton.onclick = function(){

    scores.M = 0;
    scores.T = 0;

    updateScores();

    startNewRound();

};


/* Enter */

nameM.onkeydown = function(event){

    if(event.key === "Enter"){
        nameT.focus();
    }

};


nameT.onkeydown = function(event){

    if(event.key === "Enter"){
        startFriend.click();
    }

};

</script>

</body>
</html>

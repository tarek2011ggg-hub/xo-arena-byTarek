<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XO ARENA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
min-height:100vh;font-family:Arial,sans-serif;color:#fff;overflow-x:hidden;
position:relative;display:flex;justify-content:center;align-items:center;padding:15px;
background:
linear-gradient(180deg,rgba(206,17,38,.2),rgba(255,255,255,.055) 45%,rgba(0,122,61,.2)),
radial-gradient(circle at 20% 20%,rgba(70,90,180,.2),transparent 30%),
radial-gradient(circle at 80% 80%,rgba(80,180,130,.12),transparent 30%),
linear-gradient(135deg,#070812,#11152b 50%,#070812);
}
body:before,body:after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-1}
body:before{background:linear-gradient(135deg,transparent 30%,rgba(206,17,38,.12) 45%,transparent 60%);animation:egyptMove 9s linear infinite}
body:after{background:linear-gradient(315deg,transparent 30%,rgba(0,122,61,.1) 45%,transparent 60%);animation:redMove 12s linear infinite}
@keyframes egyptMove{0%{transform:translate(-8%,-4%) rotate(0)}50%{transform:translate(8%,5%) rotate(8deg)}100%{transform:translate(-8%,-4%) rotate(0)}}
@keyframes redMove{0%{transform:translate(8%,5%)}50%{transform:translate(-8%,-5%)}100%{transform:translate(8%,5%)}}
.game{width:min(100%,760px);position:relative}
.logo{text-align:center;font-size:clamp(38px,10vw,78px);font-weight:900;letter-spacing:4px;text-shadow:0 0 25px rgba(255,255,255,.2);margin-bottom:4px}
.subtitle{text-align:center;opacity:.7;margin-bottom:18px}
.screen{display:none}
.screen.active{display:block}
.panel{background:rgba(10,12,28,.8);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.modeBtn,.levelBtn,.startBtn,.shopBtn,.musicBtn{border:0;color:#fff;border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.08);cursor:pointer;font-weight:800;transition:.2s}
.modeBtn:hover,.levelBtn:hover,.startBtn:hover,.shopBtn:hover,.musicBtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
.modeBtn.selected,.levelBtn.selected{outline:2px solid #fff;background:rgba(255,255,255,.16)}
.startBtn{width:100%;margin-top:14px;background:linear-gradient(135deg,#ce1126,#008b4c)}
input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#090b17;color:#fff;outline:0;margin:7px 0}
.coinBar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.coins{font-weight:900;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);padding:10px 14px;border-radius:14px}
.shopBtn{background:rgba(255,215,0,.12)}
.players{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:15px}
.player{padding:12px;border-radius:18px;background:rgba(255,255,255,.06);text-align:center}
.avatar{font-size:34px;font-weight:900;min-height:42px}
.score{font-size:24px;font-weight:900}
.vs{font-weight:900;opacity:.7}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:500px;margin:0 auto}
.cell{aspect-ratio:1;border:0;border-radius:18px;background:rgba(255,255,255,.075);color:#fff;font-size:clamp(42px,12vw,82px);font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:.15s}
.cell:hover:not(:disabled){transform:scale(1.025);background:rgba(255,255,255,.12)}
.cell.m{color:#ef3340;text-shadow:0 0 20px rgba(239,51,64,.45)}
.cell.t{color:#00c875;text-shadow:0 0 20px rgba(0,200,117,.4)}
.turn{text-align:center;margin:14px 0;font-weight:900;min-height:24px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.active{display:flex}
.modal{width:min(100%,500px);background:#0d1022;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.skin{padding:14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.skinPreview{font-size:38px;font-weight:900;margin:8px}
.skin button{width:100%;border:0;border-radius:12px;padding:10px;background:#222842;color:#fff;font-weight:800;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#101426;border:1px solid rgba(255,255,255,.12);padding:12px 18px;border-radius:14px;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.players{grid-template-columns:1fr 1fr}.vs{display:none}.shopGrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="game">
<div class="logo">XO ARENA</div>
<div class="subtitle">لعبة XO المصرية ⚡</div>

<section id="homeScreen" class="screen active">
<div class="panel">
<div class="coinBar">
<div class="coins">🪙 <span id="coinText">0</span></div>
<button class="shopBtn" id="openShop">🛒 المتجر</button>
</div>

<h3>اختار طريقة اللعب</h3>
<div class="row">
<button class="modeBtn selected" data-mode="friend">👥 ضد صاحبك</button>
<button class="modeBtn" data-mode="computer">🤖 ضد الكمبيوتر</button>
</div>

<div id="levelBox" style="display:none">
<h3>المستوى</h3>
<div class="row">
<button class="levelBtn selected" data-level="1">سهل</button>
<button class="levelBtn" data-level="2">متوسط</button>
<button class="levelBtn" data-level="3">صعب</button>
<button class="levelBtn" data-level="4">خبير</button>
<button class="levelBtn" data-level="5">أسطوري</button>
</div>
</div>

<div id="nameBox">
<h3>الأسماء</h3>
<input id="nameM" placeholder="اسم اللاعب الأول">
<input id="nameT" placeholder="اسم اللاعب الثاني">
</div>

<button class="startBtn" id="startBtn">ابدأ اللعب</button>
</div>
</section>

<section id="gameScreen" class="screen">
<div class="panel">
<div class="players">
<div class="player">
<div class="avatar" id="avatarM">X</div>
<div id="playerNameM">اللاعب الأول</div>
<div class="score" id="scoreM">0</div>
</div>
<div class="vs">VS</div>
<div class="player">
<div class="avatar" id="avatarT">O</div>
<div id="playerNameT">اللاعب الثاني</div>
<div class="score" id="scoreT">0</div>
</div>
</div>

<div class="turn" id="turnText"></div>
<div class="board" id="board"></div>

<div class="row" style="margin-top:15px">
<button class="startBtn" id="newRound" style="margin-top:0">جولة جديدة</button>
<button class="modeBtn" id="backHome">القائمة الرئيسية</button>
</div>
</div>
</section>
</div>

<div class="overlay" id="winnerOverlay">
<div class="modal">
<h1 id="winnerTitle">🎉 فائز!</h1>
<p id="winnerText"></p>
<button class="startBtn" id="winnerNext">جولة جديدة</button>
</div>
</div>

<div class="overlay" id="drawOverlay">
<div class="modal">
<h1>🤝 تعادل</h1>
<p>مفيش فائز في الجولة دي.</p>
<button class="startBtn" id="drawNext">جولة جديدة</button>
</div>
</div>

<div class="overlay" id="shopOverlay">
<div class="modal">
<h2>🛒 متجر الأشكال</h2>
<div class="shopGrid" id="shopGrid"></div>
<button class="modeBtn" id="closeShop" style="margin-top:12px;width:100%">إغلاق</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);

/*
M = اللاعب الأول
T = الكمبيوتر / اللاعب الثاني

ثابت داخليًا:
M = X
T = O

مهم:
الـSkin يغير الشكل الظاهر فقط.
منطق اللعبة يظل X/O داخليًا.
*/

const SYMBOLS={
M:"X",
T:"O"
};

const WIN_PATTERNS=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

const SKINS=[
{
id:"classic",
name:"Classic",
price:0,
x:"X",
o:"O"
},
{
id:"fire",
name:"🔥 Fire",
price:250,
x:"✕",
o:"◉"
},
{
id:"lightning",
name:"⚡ Lightning",
price:400,
x:"⚡",
o:"◉"
},
{
id:"diamond",
name:"💎 Diamond",
price:600,
x:"✦",
o:"◉"
},
{
id:"galaxy",
name:"🌌 Galaxy",
price:750,
x:"✕",
o:"◯"
},
{
id:"royal",
name:"👑 Royal",
price:1000,
x:"♛",
o:"♕"
}
];

const REWARDS={
1:50,
2:75,
3:100,
4:150,
5:250
};

let coins=Number(localStorage.getItem("xo_coins")||0);
let selected=localStorage.getItem("xo_skin")||"classic";
let owned=JSON.parse(localStorage.getItem("xo_owned")||'["classic"]');

if(!owned.includes("classic")){
owned.push("classic");
}

let gameMode="friend";
let computerLevel=1;
let currentPlayer="M";
let gameOver=false;
let cells=[];
let scoreM=0;
let scoreT=0;
let playerNameM="اللاعب الأول";
let playerNameT="اللاعب الثاني";

function saveEconomy(){
localStorage.setItem("xo_coins",String(coins));
localStorage.setItem("xo_skin",selected);
localStorage.setItem("xo_owned",JSON.stringify(owned));
}

function updateCoins(){
$("coinText").textContent=coins;
}

function refreshAvatars(){

const skin=
SKINS.find(s=>s.id===selected)
||SKINS[0];

$("avatarM").textContent=skin.x;
$("avatarT").textContent=skin.o;

}

function showToast(message){

const toast=$("toast");

toast.textContent=message;
toast.classList.add("show");

clearTimeout(showToast.timer);

showToast.timer=setTimeout(()=>{
toast.classList.remove("show");
},1800);

}

function renderShop(){

const grid=$("shopGrid");

grid.innerHTML="";

SKINS.forEach(skin=>{

const box=document.createElement("div");

box.className="skin";

box.innerHTML=`
<div><b>${skin.name}</b></div>
<div class="skinPreview">${skin.x} ${skin.o}</div>
<div>🪙 ${skin.price}</div>
`;

const button=document.createElement("button");

if(selected===skin.id){

button.textContent="مستخدم حاليًا";

}else if(owned.includes(skin.id)){

button.textContent="اختيار";

}else{

button.textContent=
skin.price<=coins
?`شراء 🪙 ${skin.price}`
:"رصيد غير كافي";

}

button.onclick=()=>{

if(selected===skin.id){

showToast("الشكل مستخدم بالفعل");
return;

}

if(owned.includes(skin.id)){

selected=skin.id;

saveEconomy();
renderShop();
refreshAvatars();

showToast("تم اختيار الشكل");

return;

}

if(coins<skin.price){

showToast("الرصيد غير كافي");
return;

}

coins-=skin.price;

owned.push(skin.id);
selected=skin.id;

saveEconomy();
updateCoins();
renderShop();
refreshAvatars();

showToast("تم شراء الشكل وتجهيزه");

};

box.appendChild(button);
grid.appendChild(box);

});

}

function showReward(amount){

showToast(`🎉 كسبت ${amount} 🪙`);

}

function awardWinCoins(){

if(
gameMode!=="computer"||
currentPlayer!=="M"
)
return;

const amount=
REWARDS[computerLevel]||0;

if(amount<=0)
return;

coins+=amount;

saveEconomy();
updateCoins();

showReward(amount);

}

function showScreen(id){

document.querySelectorAll(".screen").forEach(screen=>{
screen.classList.remove("active");
});

$(id).classList.add("active");

}

function setupMode(){

const isComputer=gameMode==="computer";

$("levelBox").style.display=
isComputer
?"block"
:"none";

$("nameT").placeholder=
isComputer
?"اسمك/اسم اللاعب"
:"اسم اللاعب الثاني";

}

function createBoard(){

const board=$("board");

board.innerHTML="";

cells=[];

for(let i=0;i<9;i++){

const cell=document.createElement("button");

cell.className="cell";
cell.dataset.index=i;
cell.dataset.symbol="";
cell.disabled=false;

cell.addEventListener("click",()=>{
makeMove(i);
});

board.appendChild(cell);
cells.push(cell);

}

}

function putSymbol(cell,player){

const skin=
SKINS.find(s=>s.id===selected)
||SKINS[0];

const visibleSymbol=
player==="M"
?skin.x
:skin.o;

cell.textContent=visibleSymbol;

cell.classList.remove("m","t");

cell.classList.add(
player==="M"
?"m"
:"t"
);

/*
مهم:
نحتفظ بـ X و O داخليًا
عشان فحص الفوز والـMinimax يفضلوا شغالين.
*/

cell.dataset.symbol=
player==="M"
?"X"
:"O";

cell.disabled=true;

}

function startNewRound(){

gameOver=false;
currentPlayer="M";

createBoard();

updateScore();
refreshAvatars();
updateTurn();

$("winnerOverlay").classList.remove("active");
$("drawOverlay").classList.remove("active");

}

function makeMove(index){

if(gameOver)
return;

if(
gameMode==="computer"&&
currentPlayer==="T"
)
return;

const cell=cells[index];

if(!cell||cell.dataset.symbol)
return;

putSymbol(
cell,
currentPlayer
);

playMoveSound(
currentPlayer==="M"
?"X"
:"O"
);

const winner=
checkWinner();

if(winner){

finishRound(winner);

return;

}

if(isDraw()){

finishDraw();

return;

}

/*
في اللعب ضد صاحبك:
M ثم T ثم M ثم T

في اللعب ضد الكمبيوتر:
M ثم T، والـT يتم عن طريق الكمبيوتر.
*/

currentPlayer=
currentPlayer==="M"
?"T"
:"M";

updateTurn();

if(
gameMode==="computer"&&
currentPlayer==="T"&&
!gameOver
){

setTimeout(
computerMove,
350
);

}

}

function checkWinner(){

for(const pattern of WIN_PATTERNS){

const a=cells[pattern[0]].dataset.symbol;
const b=cells[pattern[1]].dataset.symbol;
const c=cells[pattern[2]].dataset.symbol;

if(a&&a===b&&a===c){

return a==="X"
?"M"
:"T";

}

}

return null;

}

function isDraw(){

return cells.every(cell=>cell.dataset.symbol);

}

function finishRound(winner){

gameOver=true;

if(winner==="M"){

scoreM++;

}else{

scoreT++;

}

updateScore();

const winnerName=
winner==="M"
?playerNameM
:playerNameT;

$("winnerTitle").textContent=
winner==="M"
?"🎉 فاز اللاعب الأول!"
:"🎉 فاز اللاعب الثاني!";

$("winnerText").textContent=
`${winnerName} كسب الجولة!`;

playWinSound();

if(
gameMode==="computer"&&
winner==="M"
){

/*
المكافأة تعتمد على فوز اللاعب
وليس على شكل الـSkin.
*/

const amount=
REWARDS[computerLevel]||0;

coins+=amount;

saveEconomy();
updateCoins();

if(amount>0){
showReward(amount);
}

}

$("winnerOverlay").classList.add("active");

}

function finishDraw(){

gameOver=true;

playDrawSound();

$("drawOverlay").classList.add("active");

}

function updateScore(){

$("scoreM").textContent=scoreM;
$("scoreT").textContent=scoreT;

}

function updateTurn(){

if(gameOver){

$("turnText").textContent="";

return;

}

const name=
currentPlayer==="M"
?playerNameM
:playerNameT;

const skin=
SKINS.find(s=>s.id===selected)
||SKINS[0];

const visible=
currentPlayer==="M"
?skin.x
:skin.o;

$("turnText").textContent=
`دور ${name} ${visible}`;

}

function getBoardState(){

return cells.map(cell=>cell.dataset.symbol||"");

}

function checkWinnerState(board){

for(const pattern of WIN_PATTERNS){

const a=board[pattern[0]];
const b=board[pattern[1]];
const c=board[pattern[2]];

if(a&&a===b&&a===c){
return a;
}

}

if(board.every(Boolean)){
return "D";
}

return null;

}

function emptyIndexes(board){

const result=[];

for(let i=0;i<board.length;i++){

if(!board[i]){
result.push(i);
}

}

return result;

}

function minimax(board,depth,isMaximizing){

const result=checkWinnerState(board);

if(result==="O") return 10-depth;
if(result==="X") return depth-10;
if(result==="D") return 0;

if(isMaximizing){

let best=-Infinity;

for(const index of emptyIndexes(board)){

board[index]="O";

best=Math.max(
best,
minimax(board,depth+1,false)
);

board[index]="";

}

return best;

}else{

let best=Infinity;

for(const index of emptyIndexes(board)){

board[index]="X";

best=Math.min(
best,
minimax(board,depth+1,true)
);

board[index]="";

}

return best;

}

}

function computerMove(){

if(
gameOver||
gameMode!=="computer"||
currentPlayer!=="T"
)
return;

const board=getBoardState();
const empty=emptyIndexes(board);

if(!empty.length)
return;

let move;

if(computerLevel<=1){

move=
empty[
Math.floor(Math.random()*empty.length)
];

}else if(computerLevel===2){

move=getSimpleComputerMove(board,empty);

}else{

move=getBestMove(board,empty);

}

const cell=cells[move];

if(!cell||cell.dataset.symbol)
return;

putSymbol(
cell,
"T"
);

playMoveSound("O");

const winner=
checkWinner();

if(winner){

finishRound(winner);
return;

}

if(isDraw()){

finishDraw();
return;

}

currentPlayer="M";

updateTurn();

}

function getSimpleComputerMove(board,empty){

for(const index of empty){

const copy=board.slice();

copy[index]="O";

if(checkWinnerState(copy)==="O"){
return index;
}

}

for(const index of empty){

const copy=board.slice();

copy[index]="X";

if(checkWinnerState(copy)==="X"){
return index;
}

}

if(!board[4]&&empty.includes(4)){
return 4;
}

const corners=[0,2,6,8].filter(i=>empty.includes(i));

if(corners.length){

return corners[
Math.floor(Math.random()*corners.length)
];

}

return empty[
Math.floor(Math.random()*empty.length)
];

}

function getBestMove(board,empty){

let bestScore=-Infinity;
let bestMoves=[];

for(const index of empty){

board[index]="O";

const score=
minimax(board,0,false);

board[index]="";

if(score>bestScore){

bestScore=score;
bestMoves=[index];

}else if(score===bestScore){

bestMoves.push(index);

}

}

return bestMoves[
Math.floor(Math.random()*bestMoves.length)
];

}

let audioContext=null;

function getAudio(){

if(!audioContext){

audioContext=
new(window.AudioContext||window.webkitAudioContext)();

}

return audioContext;

}

function playTone(
frequency,
duration=.1,
type="sine",
volume=.04
){

try{

const ctx=getAudio();

const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type=type;
osc.frequency.value=frequency;

gain.gain.setValueAtTime(
volume,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime+duration
);

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();
osc.stop(ctx.currentTime+duration);

}catch(e){}

}

function playMoveSound(symbol){

playTone(
symbol==="X"
?520
:420,
.08,
"sine",
.035
);

}

function playWinSound(){

playTone(660,.12,"sine",.05);

setTimeout(()=>{
playTone(880,.14,"sine",.05);
},100);

setTimeout(()=>{
playTone(1100,.18,"sine",.05);
},220);

}

function playDrawSound(){

playTone(260,.16,"triangle",.04);

setTimeout(()=>{
playTone(220,.18,"triangle",.035);
},150);

}

document.querySelectorAll(".modeBtn[data-mode]").forEach(button=>{

button.addEventListener("click",()=>{

document
.querySelectorAll(".modeBtn[data-mode]")
.forEach(b=>b.classList.remove("selected"));

button.classList.add("selected");

gameMode=button.dataset.mode;

setupMode();

});

});

document.querySelectorAll(".levelBtn").forEach(button=>{

button.addEventListener("click",()=>{

document
.querySelectorAll(".levelBtn")
.forEach(b=>b.classList.remove("selected"));

button.classList.add("selected");

computerLevel=
Number(button.dataset.level);

});

});

$("startBtn").addEventListener("click",()=>{

playerNameM=
$("nameM").value.trim()||
"اللاعب الأول";

playerNameT=
$("nameT").value.trim()||
(
gameMode==="computer"
?"الكمبيوتر"
:"اللاعب الثاني"
);

$("playerNameM").textContent=playerNameM;
$("playerNameT").textContent=playerNameT;

scoreM=0;
scoreT=0;

updateScore();
showScreen("gameScreen");
startNewRound();

});

$("newRound").addEventListener(
"click",
startNewRound
);

$("backHome").addEventListener("click",()=>{

showScreen("homeScreen");
$("winnerOverlay").classList.remove("active");
$("drawOverlay").classList.remove("active");

});

$("winnerNext").addEventListener(
"click",
startNewRound
);

$("drawNext").addEventListener(
